<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minha conta | IntegraHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
  </head>
  <body class="auth-loading">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand"><span class="brand-mark">IH</span><span>IntegraHub</span></div>
        <nav class="sidebar-nav">
          <a class="nav-link" href="/dashboard/index.html">Dashboard</a>
          <a class="nav-link" href="/integracoes/index.html">Integrações</a>
          <a class="nav-link" href="/execucoes/index.html">Execuções</a>
          <a class="nav-link" href="/logs/index.html">Logs</a>
          <a class="nav-link" href="/auditoria/index.html">Auditoria</a>
        <a class="nav-link" href="/automacao/index.html">Automa??o</a></nav>
      </aside>
      <div class="content-area">
        <header class="topbar"><div><h1>IntegraHub</h1><span class="text-muted">Minha conta</span></div></header>
        <main class="main-content">
          <section class="section-block">
            <div class="section-heading"><div><p class="section-kicker">Conta</p><h2>Meu perfil</h2></div></div>
            <div class="info-card"><dl class="details-grid"><dt>E-mail</dt><dd id="profile-email">–</dd><dt>Perfil</dt><dd id="profile-role">–</dd></dl></div>
          </section>
          <section class="section-block">
            <div class="section-heading"><div><p class="section-kicker">Segurança</p><h2>Trocar senha</h2></div></div>
            <form id="password-change-form" class="info-card profile-form">
              <div id="profile-alert" role="alert"></div>
              <label class="form-label" for="current-password">Senha atual</label>
              <input class="form-control mb-3" id="current-password" type="password" required autocomplete="current-password">
              <label class="form-label" for="new-password">Nova senha</label>
              <input class="form-control mb-3" id="new-password" type="password" required minlength="12" maxlength="128" autocomplete="new-password">
              <label class="form-label" for="confirm-password">Confirmar nova senha</label>
              <input class="form-control mb-3" id="confirm-password" type="password" required minlength="12" maxlength="128" autocomplete="new-password">
              <p class="text-muted">Use de 12 a 128 caracteres. Após a troca, entre novamente em todos os dispositivos.</p>
              <button class="btn btn-primary" type="submit">Salvar nova senha</button>
            </form>
          </section>
        </main>
      </div>
    </div>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/profile.js"></script>
  </body>
</html>
