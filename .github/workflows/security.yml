name: Security and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: integrahub_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: integrahub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integrahub_ci -d integrahub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://integrahub_ci:ci-only-password@127.0.0.1:5432/integrahub_test?schema=public
      TEST_DATABASE_URL: postgresql://integrahub_ci:ci-only-password@127.0.0.1:5432/integrahub_test?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        working-directory: backend
        run: npm ci --include=dev
      - name: Check private files and credentials
        working-directory: backend
        run: npm run security:check
      - name: Audit dependencies
        working-directory: backend
        run: npm audit --audit-level=moderate
      - name: Prepare isolated test database
        working-directory: backend
        run: |
          npx prisma migrate deploy
          npm run prisma:generate
      - name: Run security and integration tests
        working-directory: backend
        run: npm test
      - name: Verify frontend file isolation and headers
        working-directory: frontend
        run: npm test
